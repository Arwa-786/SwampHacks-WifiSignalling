; Wi-Fi CSI firmware, built with ESP-IDF. One source file, two roles:
;   tx = classic ESP32 (ESP-WROOM-32) sender. Shows up as /dev/cu.usbserial-XXXX.
;        Once flashed it only needs power (any USB charger).
;   rx = ESP32-S3 receiver, stays plugged into the laptop through its built-in
;        USB port. Shows up as /dev/cu.usbmodemXXXX.
;
;   pio run -e tx -t upload --upload-port /dev/cu.usbserial-XXXX
;   pio run -e rx -t upload --upload-port /dev/cu.usbmodemXXXX
; Watch the raw output:
;   pio device monitor -e rx --port /dev/cu.usbmodemXXXX
;
; The chip is chosen by `board`, so either role can move to the other chip by
; swapping the two board lines.

[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
monitor_speed = 921600

[env:tx]
board = esp32dev
upload_speed = 460800  ; 921600 drops out on CH340 boards behind a USB hub
build_flags = -DCSI_ROLE_TX=1

[env:rx]
board = esp32-s3-devkitc-1
build_flags = -DCSI_ROLE_TX=0

; Research build: receiver also sends the HT-LTF block (lines twice as long).
; host code still uses the first (LLTF) block; diagnose.py logs keep both.
[env:rx_both]
board = esp32-s3-devkitc-1
build_flags = -DCSI_ROLE_TX=0 -DCSI_HTLTF=1
