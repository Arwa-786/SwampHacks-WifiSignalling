<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFind · Rescue Watch</title>
<!--
  Fire rescue mode, drawn with the same pixel engine as the swamp game (pixel.js).
  A cabin is burning in the swamp at night; the front wall is cut away so you can
  see the room: the 3 Wi-Fi receivers on the left wall, the curtain, the hiding
  spot and the transmitter lantern on the right wall.

  Nothing about the person is drawn or invented: the only thing at the hiding
  spot is the Wi-Fi "echo", driven by the live verdict (/api/sense):
     nobody seen   no echo
     still         slow, steady rings (someone there, not moving: priority 1)
     moving        bright, jittery rings (priority 2)
  The gator's line comes from /api/ai/rescue (the AI gator, or a fixed template).
-->
<style>
  html, body { margin: 0; height: 100%; background: #1a1c2c; overflow: hidden; }
  canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sr:focus { position: fixed; left: 8px; top: 8px; width: auto; height: auto; clip: auto; padding: 6px 10px;
    background: #1a1c2c; color: #ffcd75; outline: 3px solid #a7f070; z-index: 2; }
</style>
</head>
<body>
<canvas id="screen" aria-hidden="true"></canvas>
<a class="sr" href="/">Back to the swamp game</a>
<div class="sr" id="live" aria-live="polite"></div>

<script src="/static/pixel.js"></script>
<script>if (!window.Pixel) document.body.innerHTML = '<p style="color:#ffcd75;font:16px monospace;padding:24px">Can\'t load /static/pixel.js. The WiFind server running here is older than this page: restart it (Ctrl+C, then python app.py ...).</p>';</script>
<script>
(() => {
  "use strict";
  const { textWidth, text, wrap, sprite, PORTRAIT, rect, ellipse, ring, ditherPick, windowBox, get, fit } = Pixel;
  const screen = document.getElementById("screen");
  const ctx = screen.getContext("2d");
  let W = 320, H = 180, SCALE = 4;
  const resize = () => ({ W, H, SCALE } = fit(screen));
  addEventListener("resize", resize);
  resize();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // the gator, with a firefighter's helmet
  const FIRE_GATOR = [
    "....KKKKKKKKKK....",
    "..KKRRRRRRRRRRKK..",
    ".KRRRRRYYRRRRRRRK.",
    "KKKKKKKKKKKKKKKKKK",
    "..KgWWKK..KgWWKK..",
    "..KgWKKK..KgWKKK..",
    ...PORTRAIT.slice(4),
  ];
  const LANTERN = ["..KKK..", "..K.K..", ".KKKKK.", ".KYYYK.", ".KYWYK.", ".KYYYK.", ".KKKKK."];
  const FLAME_BODY = ["..YOORRY...", "..YORRROY..", ".YORRRROY..", ".YORRPRROY.", "YORRPPPRROY", "YORRPPPRROY",
    ".YORRRRROY.", "..YOOOOOY..", "...YYYYY..."];
  const FLAME = [                               // 11 x 14, three flickering tips over one body
    [".....Y.....", "....YY.....", "....YOY....", "...YOOY....", "...YOOOY..."],
    ["......Y....", ".....YY....", "....YOY....", "....YOOY...", "...YOOOY..."],
    ["....Y......", "....YY.....", "...YOY.....", "...YOOY....", "...YOOOY..."],
  ].map((tip) => tip.concat(FLAME_BODY));

  // ------------------------------------------------------------- what we know
  const S = { sense: null, rescue: null, online: false };
  async function pollSense() { S.sense = await get("/api/sense"); S.online = !!S.sense && S.sense.state !== "OFFLINE"; }
  async function pollRescue() { const r = await get("/api/ai/rescue?room=Room%201"); if (r) S.rescue = r; }

  // the breathing model's live answer (breathing_model.BreathingLive), as words for the notes
  function breathing() {
    const b = S.online && S.sense.breathing;
    if (!b) return { text: "?", col: "L", rate: null };
    // Only yes/no: the rate (breaths per minute) was 2-4 off in our tests, so it isn't shown.
    if (b.status === "ok") return b.present ? { text: "YES", col: "l", rate: null } : { text: "NO", col: "W", rate: null };
    const words = { "moving": "WAIT", "needs scan": "NEEDS SCAN", "warming up": "WARMING UP",
                    "weak signal": "WEAK SIGNAL", "no model": "NO MODEL" };
    return { text: words[b.status] || "?", col: "L", rate: null };
  }

  // Three uses of the same sensing: fire rescue, smart lights, hot car. #lights / #car in the URL.
  const MODES = ["rescue", "lights", "car"];
  let mode = MODES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "rescue";
  addEventListener("hashchange", () => { if (MODES.includes(location.hash.slice(1))) mode = location.hash.slice(1); });
  let lastSeen = 0;            // when anyone was last seen (smart lights stay on a while after)
  const LIGHTS_GRACE_S = 20;

  // what each mode says about the same reading: label plate, alert box, gator's line
  function view(st, t) {
    const present = st.key === "still" || st.key === "moving";
    if (present) lastSeen = t;
    const breathing_ = breathing().text === "YES";
    if (mode === "lights") {
      const left = Math.max(0, Math.ceil(LIGHTS_GRACE_S - (t - lastSeen) / 1000));
      const on = present || (lastSeen > 0 && left > 0);
      const say = !S.online ? "NO SIGNAL. LIGHTS STAY AS THEY ARE."
        : st.key === "moving" ? "SOMEONE IS MOVING AROUND. LIGHTS ON."
        : st.key === "still" ? "SOMEONE IS SITTING STILL" + (breathing_ ? " AND BREATHING" : "") +
          ". A MOTION SENSOR WOULD SWITCH THE LIGHTS OFF NOW. WIFIND KEEPS THEM ON."
        : on ? `NOBODY SEEN. LIGHTS OFF IN ${left} S.` : "ROOM EMPTY. LIGHTS OFF, SAVING ENERGY.";
      return { plate: "WIFIND SMART LIGHTS", place: "LIVING ROOM", box: "LIGHTS", value: on ? "ON" : "OFF",
        panel: on ? "Y" : "D", ink: on ? "K" : "W", flash: false, light: on, crew: "GATOR, HOME HELPER", say };
    }
    if (mode === "car") {
      const say = !S.online ? "NO SIGNAL FROM THE CAR SENSOR."
        : st.key === "moving" ? "CAR PARKED, BUT SOMETHING IS MOVING INSIDE. CHECK THE CAR NOW!"
        : st.key === "still" ? (breathing_ ? "CAR PARKED. NOTHING MOVING, BUT BREATHING-LIKE MOTION IN THE BACK SEAT. CHECK THE CAR NOW!"
          : "CAR PARKED. SOMEONE MAY BE INSIDE, NOT MOVING. CHECK THE CAR.")
        : "CAR EMPTY. NOTHING BREATHING INSIDE.";
      return { plate: "WIFIND CAR CHECK", place: "BACK SEAT", box: "INSIDE", value: !S.online ? "?" : present ? "YES!" : "NO",
        panel: present ? "R" : "G", ink: "W", flash: present, crew: "GATOR, CAR CHECK", say };
    }
    return { plate: "WIFIND RESCUE SCANNER", place: "ROOM 1", box: "PRIORITY", value: st.priority, panel: st.panel, ink: "W",
      flash: st.priority === "1", crew: "GATOR, RESCUE CREW", say: st.say, helmet: true };
  }

  // the room's status, in one place: what the sign, the echo and the notes show
  function status() {
    if (!S.online) return { key: "offline", sign: "NO SIGNAL", panel: "N", person: "?", moving: "?", priority: "-",
      say: "NO SIGNAL FROM THE BOOTH. WE CAN'T SEE INSIDE ROOM 1 RIGHT NOW." };
    const st = S.sense.state;
    if (st === "SCANNING" || st === "UNCALIBRATED") return { key: "scan", sign: "SCANNING ROOM", panel: "B",
      person: "?", moving: "?", priority: "-", say: "LEARNING WHAT THE EMPTY ROOM LOOKS LIKE. STAND CLEAR." };
    const line = S.rescue && S.rescue.line;
    if (st === "MOVING") return { key: "moving", sign: "PERSON, MOVING", panel: "O", person: "YES", moving: "YES",
      priority: "2", say: line || "ROOM 1: SOMEONE IS INSIDE AND MOVING. PRIORITY 2." };
    if (st === "STILL") {
      const br = breathing();
      const extra = br.text === "YES" ? " BREATHING-LIKE MOTION DETECTED." : "";
      return { key: "still", sign: "PERSON, NOT MOVING", panel: "R", person: "YES", moving: "NO",
        priority: "1", say: (line || "ROOM 1: SOMEONE IS INSIDE AND NOT MOVING. PRIORITY 1.") + extra };
    }
    return { key: "empty", sign: "NOBODY SEEN", panel: "G", person: "NOT SEEN", moving: "-", priority: "-",
      say: "ROOM 1: THE WI-FI DOESN'T SEE ANYONE. CHECK IT ANYWAY." };
  }

  // ------------------------------------------------------------- the night swamp + burning cabin
  // ------------------------------------------------------------- the night: a burning cabin on the horizon
  function drawWorld(t, v) {
    const step = reduce ? 0 : Math.floor(t / 125);
    const horizon = H - 62;
    for (let y = 0; y < horizon; y++) for (let x = 0; x < W; x++) {   // night sky, fire glow low down
      const tt = (y / horizon - 0.45) / 0.55;
      ctx.fillStyle = Pixel.P[tt <= 0 ? "K" : tt >= 1 ? "P" : (ditherPick(x, y, tt) ? "P" : "N")];
      ctx.fillRect(x, y, 1, 1);
    }
    for (let i = 0; i < W / 6; i++) {                                   // stars, scattered (not in rows)
      const hx = (i * 2654435761) >>> 0;
      rect(ctx, (i % 7) ? "W" : "Y", hx % W, 4 + ((hx >>> 12) % Math.floor(horizon * 0.5)), 1, 1);
    }
    for (let x = 0; x < W; x += 12) { ellipse(ctx, "K", x + 6, horizon - 10 - ((x * 7) % 7), 7, 7); rect(ctx, "K", x, horizon - 10, 14, 10); }
    const cx = 18, cy = horizon - 22;
    if (mode === "lights") {                                           // a cabin at night, window lit or dark
      rect(ctx, "K", cx, cy, 34, 22);
      for (let r = 0; r < 9; r++) rect(ctx, "K", cx - 4 + r * 2, cy - 1 - r, 42 - r * 4, 1);
      rect(ctx, v.light ? "Y" : "D", cx + 6, cy + 6, 8, 7); rect(ctx, v.light ? "Y" : "D", cx + 20, cy + 6, 8, 7);
      if (v.light) for (let k = 0; k < 6; k++) rect(ctx, "Y", cx + 4 + k * 5, horizon + 3 + (k % 3), 2, 1);
      rect(ctx, "N", 0, horizon, W, H - horizon); rect(ctx, "T", 0, horizon, W, 1);
      return;
    }
    if (mode === "car") {                                              // a parked car under a hot sun
      ellipse(ctx, "Y", 40, 30, 9, 9); for (let k = 0; k < 8; k++) rect(ctx, "Y", 40 + Math.round(Math.cos(k * 0.8) * 13), 30 + Math.round(Math.sin(k * 0.8) * 13), 2, 2);
      rect(ctx, "D", 0, horizon, W, H - horizon); rect(ctx, "G", 0, horizon, W, 1);   // a car park
      for (let x = 6; x < 90; x += 22) rect(ctx, "L", x, horizon + 14, 12, 1);
      rect(ctx, "K", cx - 4, cy + 6, 46, 12); rect(ctx, "K", cx + 6, cy - 2, 24, 9);   // car silhouette
      rect(ctx, "C", cx + 9, cy, 8, 6); rect(ctx, "C", cx + 19, cy, 8, 6);
      ellipse(ctx, "K", cx + 6, cy + 18, 4, 4); ellipse(ctx, "K", cx + 32, cy + 18, 4, 4);
      if (!reduce) for (let k = 0; k < 5; k++) rect(ctx, "O", cx + 2 + k * 8, cy - 8 - ((Math.floor(t / 250) + k) % 4), 1, 3); // heat
      return;
    }
    // the cabin, burning, far off on the left
    rect(ctx, "K", cx, cy, 34, 22);
    for (let r = 0; r < 9; r++) rect(ctx, "K", cx - 4 + r * 2, cy - 1 - r, 42 - r * 4, 1);
    rect(ctx, step % 2 ? "O" : "Y", cx + 6, cy + 6, 6, 5); rect(ctx, step % 2 ? "Y" : "O", cx + 22, cy + 6, 6, 5);
    for (let k = 0; k < 3; k++) sprite(ctx, FLAME[(step + k) % 3], cx + 2 + k * 11, cy - 22 + (k % 2) * 3);
    for (let i = 0; i < 6; i++) {                                      // smoke rising off it
      const life = ((step + i * 10) % 60) / 60, px = cx + 20 + Math.round(life * 50), py = cy - 26 - Math.round(life * 40);
      for (let y = -3; y <= 3; y++) for (let x = -5; x <= 5; x++)
        if (x * x / 25 + y * y / 9 <= 1 && ditherPick(px + x, py + y, 0.55 - life * 0.45)) rect(ctx, "G", px + x, py + y, 1, 1);
    }
    rect(ctx, "N", 0, horizon, W, H - horizon); rect(ctx, "T", 0, horizon, W, 1);   // swamp water
    for (let x = 0; x < 60; x += 2) if ((x + step) % 5 < 2) rect(ctx, "O", cx - 6 + x, horizon + 2 + (x % 4), 1, 1);
  }

  // ------------------------------------------------------------- the handheld rescue scanner
  function drawScanner(t, st, v) {
    const step = reduce ? 0 : Math.floor(t / 125);
    const x = Math.max(96, Math.floor((W - 250) / 2 + 40)), y = 6;
    const w = Math.min(W - x - 6, 250), h = H - 38 - 6 - y;
    // antenna + blinking tip
    rect(ctx, "K", x + w - 22, y - 2, 3, 12); rect(ctx, "G", x + w - 21, y - 1, 1, 10);
    rect(ctx, (step % 8 < 4 && S.online) ? "l" : "D", x + w - 22, y - 4, 3, 3);
    // body: chunky orange casing, corners cut, light top edge, dark bottom edge
    rect(ctx, "K", x + 2, y + 4, w - 4, h - 4); rect(ctx, "K", x, y + 6, w, h - 8);
    rect(ctx, "O", x + 2, y + 6, w - 4, h - 8);
    rect(ctx, "Y", x + 3, y + 6, w - 6, 1); rect(ctx, "R", x + 3, y + h - 6, w - 6, 3);
    for (const [sx, sy] of [[x + 5, y + 9], [x + w - 8, y + 9], [x + 5, y + h - 10], [x + w - 8, y + h - 10]]) {
      rect(ctx, "K", sx, sy, 3, 3); rect(ctx, "L", sx + 1, sy + 1, 1, 1);   // screws
    }
    // label plate
    const plate = v.plate;
    rect(ctx, "K", x + 12, y + 9, textWidth(plate) + 8, 11); rect(ctx, "Y", x + 13, y + 10, textWidth(plate) + 6, 9);
    text(ctx, plate, x + 16, y + 11, "K");

    // the radar screen: a top-down map of room 1
    const s = { x: x + 10, y: y + 24, w: Math.floor((w - 20) * 0.6), h: h - 36 };
    rect(ctx, "K", s.x - 2, s.y - 2, s.w + 4, s.h + 4); rect(ctx, "D", s.x - 1, s.y - 1, s.w + 2, s.h + 2);
    rect(ctx, "f", s.x, s.y, s.w, s.h);
    for (let gx = s.x + 6; gx < s.x + s.w; gx += 8) for (let gy = s.y; gy < s.y + s.h; gy += 2) rect(ctx, "K", gx, gy, 1, 1);
    for (let gy = s.y + 6; gy < s.y + s.h; gy += 8) for (let gx = s.x; gx < s.x + s.w; gx += 2) rect(ctx, "K", gx, gy, 1, 1);
    const room = { x: s.x + 6, y: s.y + 10, w: s.w - 12, h: s.h - 16 };
    for (let k = 0; k < room.w; k++) { rect(ctx, "m", room.x + k, room.y, 1, 1); rect(ctx, "m", room.x + k, room.y + room.h, 1, 1); }
    for (let k = 0; k < room.h; k++) { rect(ctx, "m", room.x, room.y + k, 1, 1); rect(ctx, "m", room.x + room.w, room.y + k, 1, 1); }
    text(ctx, v.place, s.x + 3, s.y + 2, "l");
    if (mode === "rescue") {
      const curtainX = room.x + Math.floor(room.w * 0.32);
      for (let k = 1; k < room.h; k += 3) rect(ctx, "R", curtainX, room.y + k, 1, 2);     // the curtain
    } else if (mode === "lights") {                                   // ceiling lamp; its light fills the room
      const lx = room.x + Math.floor(room.w / 2), ly = room.y + 6;
      if (v.light) for (let yy = room.y + 1; yy < room.y + room.h; yy++) for (let xx = room.x + 1; xx < room.x + room.w; xx++)
        if (ditherPick(xx, yy, 0.25 - Math.hypot(xx - lx, yy - ly) / (room.w * 3))) rect(ctx, "Y", xx, yy, 1, 1);
      ellipse(ctx, "K", lx, ly, 5, 3); ellipse(ctx, v.light ? "Y" : "G", lx, ly, 4, 2);
    } else {                                                          // a car from above: body, seats
      for (let yy = room.y + 4; yy < room.y + room.h - 3; yy += 2) { rect(ctx, "G", room.x + 4, yy, 1, 1); rect(ctx, "G", room.x + room.w - 4, yy, 1, 1); }
      const seat = (fx, fy, fw, fh) => { rect(ctx, "m", room.x + Math.floor(room.w * fx), room.y + Math.floor(room.h * fy), Math.floor(room.w * fw), Math.floor(room.h * fh)); };
      seat(0.12, 0.12, 0.22, 0.3); seat(0.12, 0.58, 0.22, 0.3);       // front seats
      seat(0.52, 0.12, 0.3, 0.76);                                     // back bench
      rect(ctx, "G", room.x + room.w - 6, room.y + 4, 2, room.h - 8);  // rear window
    }
    const rxs = [0.25, 0.5, 0.75].map((f) => [room.x + 3, room.y + Math.round(room.h * f)]);
    const tx = [room.x + room.w - 4, room.y + Math.round(room.h * 0.5)];
    const spot = [room.x + Math.floor(room.w * (mode === "car" ? 0.67 : 0.64)), room.y + Math.floor(room.h * 0.5)];
    if (!S.online) {                                                  // no signal: static
      for (let i = 0; i < s.w * s.h / 9; i++) rect(ctx, ((i * 31 + step * 7) % 3) ? "D" : "m",
        s.x + ((i * 53 + step * 13) % s.w), s.y + ((i * 29 + step * 17) % s.h), 1, 1);
      const msg = "NO SIGNAL";
      rect(ctx, "K", s.x + s.w / 2 - textWidth(msg) / 2 - 3, s.y + s.h / 2 - 6, textWidth(msg) + 6, 11);
      text(ctx, msg, s.x + Math.floor(s.w / 2 - textWidth(msg) / 2), s.y + Math.floor(s.h / 2) - 4, "l");
    } else {
      // Wi-Fi waves pulsing out from the transmitter, dotted as they fade
      for (let k = 0; k < 3; k++) {
        const r = 3 + ((step + k * 9) % 27);
        ring(ctx, r > 18 ? "m" : "g", tx[0], tx[1], r, r > 12 ? 3 : 1);
      }
      for (const [rx, ry] of rxs) { rect(ctx, "K", rx - 2, ry - 2, 5, 5); rect(ctx, "C", rx - 1, ry - 1, 3, 3); }
      rect(ctx, "K", tx[0] - 2, tx[1] - 2, 5, 5); rect(ctx, "Y", tx[0] - 1, tx[1] - 1, 3, 3);
      if (st.key === "still") {                                       // a steady blip that breathes
        const rate = breathing().rate, cycle = rate ? 60000 / rate : 2400;
        const big = !reduce && (t % cycle) < cycle / 2;
        ellipse(ctx, "Y", spot[0], spot[1], big ? 3 : 2, big ? 3 : 2); ellipse(ctx, "W", spot[0], spot[1], 1, 1);
        ring(ctx, "Y", spot[0], spot[1], big ? 6 : 5, 2);
      } else if (st.key === "moving") {                               // a jittery blip with a trail
        for (let k = 3; k >= 0; k--) {
          const jx = reduce ? 0 : ((step - k) * 7 % 5) - 2, jy = reduce ? 0 : ((step - k) * 3 % 5) - 2;
          rect(ctx, k ? "R" : "O", spot[0] + jx - 1, spot[1] + jy - 1, k ? 2 : 3, k ? 2 : 3);
        }
      } else if (st.key === "scan") {
        const msg = "SCANNING...";
        text(ctx, msg, s.x + Math.floor(s.w / 2 - textWidth(msg) / 2), s.y + s.h - 9, "l");
      }
    }

    // the LCD readout
    const l = { x: s.x + s.w + 8, y: s.y - 2, w: x + w - 10 - (s.x + s.w + 8), h: s.h + 4 };
    rect(ctx, "K", l.x, l.y, l.w, l.h); rect(ctx, "N", l.x + 1, l.y + 1, l.w - 2, l.h - 2);
    const stillFor = st.key === "still" && S.rescue ? clock(S.rescue.facts.seconds_in_state) : "-";
    const br = breathing();
    const rows = [["PERSON", st.person, st.person === "YES" ? "l" : "W"], ["MOVING", st.moving, st.moving === "YES" ? "O" : "W"],
      ["STILL", stillFor, "W"], ["BREATH", br.rate ? `~${Math.round(br.rate)}` : br.text, br.col]];
    rows.forEach(([k, v, c], i) => {
      const ry = l.y + 5 + i * 10, room = l.w - 10 - textWidth(k);
      if (textWidth(v) > room) v = v.split(" ")[0];
      text(ctx, k, l.x + 4, ry, "L");
      text(ctx, v, l.x + l.w - 4 - textWidth(v), ry, c);
    });
    // signal bars: how much the Wi-Fi is wobbling right now (motion vs the freeze line)
    const m = S.online ? Math.min((S.sense.motion || 0) / 4, 1) : 0, bars = 6;
    const by = l.y + 50;
    text(ctx, "SIGNAL", l.x + 4, by, "L");
    for (let k = 0; k < bars; k++) {
      const bh = 2 + k, on = k < Math.round(m * bars) + (S.online ? 1 : 0);
      rect(ctx, on ? (k < 2 ? "l" : k < 4 ? "Y" : "O") : "D", l.x + l.w - 4 - (bars - k) * 4, by + 7 - bh, 3, bh);
    }
    if (S.sense && S.sense.simulated) text(ctx, "DEMO DATA", l.x + 4, by + 12, "Y");
    const py = l.y + l.h - 22;
    const flashing = v.flash && !reduce && step % 4 >= 2;                    // alerts blink
    rect(ctx, "K", l.x + 3, py, l.w - 6, 19); rect(ctx, flashing ? "O" : v.panel, l.x + 4, py + 1, l.w - 8, 17);
    rect(ctx, "K", l.x + 7, py + 6, 7, 7); rect(ctx, v.flash && !flashing ? "Y" : "K", l.x + 8, py + 7, 5, 5);
    const shadow = v.ink === "K" ? null : "K";
    text(ctx, v.box, l.x + 17, py + 6, v.ink, { shadow });
    text(ctx, v.value, l.x + l.w - 9 - textWidth(v.value, true), py + 6, v.ink, { bold: true, shadow });
    // a couple of chunky buttons under the plate, for the toy feel
    for (const [bx, c] of [[x + w - 46, "R"], [x + w - 32, "B"], [x + w - 18, "g"]]) {
      ellipse(ctx, "K", bx, y + 14, 4, 4); ellipse(ctx, c, bx, y + 14, 3, 3); rect(ctx, "W", bx - 1, y + 12, 1, 1);
    }
  }

  // ------------------------------------------------------------- the gator, logo, back button
  let since = 0, lastKey = "";
  let backBtn = null, hoverBack = false;
  const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  let tabs = [];
  function drawUI(t, st, v) {
    if (st.key + mode !== lastKey) { lastKey = st.key + mode; since = t; }   // retype on a new reading or mode
    const dx = 4, dh = 35, dy = H - dh - 3, dw = W - 8;
    windowBox(ctx, dx, dy, dw, dh);
    rect(ctx, "K", dx + 5, dy + 5, 22, 22); rect(ctx, "R", dx + 6, dy + 6, 20, 20);
    sprite(ctx, v.helmet ? FIRE_GATOR : PORTRAIT, dx + 7, dy + (v.helmet ? 7 : 8));
    text(ctx, v.crew, dx + 31, dy + 5, "Y");
    text(ctx, "PROTOTYPE", dx + dw - 7 - textWidth("PROTOTYPE"), dy + 5, "L");
    const lines = wrap(v.say, dw - 40).slice(0, 2);
    let shown = Math.floor((t - since) / (reduce ? 1 : 28));
    lines.forEach((ln, i) => { text(ctx, ln.slice(0, Math.max(0, shown)), dx + 31, dy + 14 + i * 9, "W"); shown -= ln.length; });

    text(ctx, "WIFIND", 5, 5, "Y", { outline: "K", shadow: "R" });
    const label = "SWAMP GAME", bw = textWidth(label) + 18;
    windowBox(ctx, 4, 16, bw, 15, hoverBack ? "T" : "D");
    const k = Math.floor(t / 400) % 2;
    rect(ctx, "Y", 10 - k, 21, 1, 5); rect(ctx, "Y", 9 - k, 22, 1, 3); rect(ctx, "Y", 8 - k, 23, 1, 1);
    text(ctx, label, 14, 20, "Y");
    backBtn = { x: 4, y: 16, w: bw, h: 15 };
    // mode tabs: the same Wi-Fi sensing, three uses
    tabs = [];
    [["rescue", "FIRE RESCUE"], ["lights", "SMART LIGHTS"], ["car", "HOT CAR"]].forEach(([m, name], i) => {
      const tw = textWidth("SMART LIGHTS") + 12, ty = 38 + i * 16;
      windowBox(ctx, 4, ty, tw, 14, m === mode ? "T" : hoverTab === m ? "G" : "D");
      text(ctx, name, 10, ty + 4, m === mode ? "Y" : "W");
      tabs.push({ m, x: 4, y: ty, w: tw, h: 14 });
    });
  }

  const toGame = (e) => { const r = screen.getBoundingClientRect(); return [(e.clientX - r.left) / SCALE, (e.clientY - r.top) / SCALE]; };
  const inside = (b, [x, y]) => b && x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h;
  let hoverTab = null;
  screen.addEventListener("click", (e) => {
    const p = toGame(e);
    if (inside(backBtn, p)) location.href = "/";
    const tab = tabs.find((b) => inside(b, p));
    if (tab) { mode = tab.m; history.replaceState(null, "", "#" + tab.m); }
  });
  screen.addEventListener("mousemove", (e) => {
    const p = toGame(e);
    hoverBack = inside(backBtn, p);
    const tab = tabs.find((b) => inside(b, p));
    hoverTab = tab ? tab.m : null;
    screen.style.cursor = hoverBack || tab ? "pointer" : "";
  });

  let lastSpoken = "";
  function frame(t) {
    const st = status();
    const v = view(st, t);
    drawWorld(t, v);
    drawScanner(t, st, v);
    drawUI(t, st, v);
    const spoken = `${v.plate}: ${v.box} ${v.value}. ${v.say}`;   // the same news for screen readers
    if (spoken !== lastSpoken) { document.getElementById("live").textContent = spoken; lastSpoken = spoken; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  pollSense(); pollRescue();
  setInterval(pollSense, 500);
  setInterval(pollRescue, 2000);
})();
</script>
</body>
</html>
