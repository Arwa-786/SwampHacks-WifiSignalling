<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WiFind · Rescue Watch</title>
<!--
  Fire rescue mode, drawn with the same pixel engine as the swamp game (pixel.js).
  A cabin is burning in the swamp at night; the front wall is cut away so you can
  see the room: the 3 Wi-Fi receivers on the left wall, the curtain, the hiding
  spot and the transmitter lantern on the right wall.

  Nothing about the person is drawn or invented: the only thing at the hiding
  spot is the Wi-Fi "echo", driven by the live verdict (/api/sense):
     nobody seen   no echo
     still         slow, steady rings (someone there, not moving: priority 1)
     moving        bright, jittery rings (priority 2)
  The gator's line comes from /api/ai/rescue (the AI gator, or a fixed template).
-->
<style>
  html, body { margin: 0; height: 100%; background: #1a1c2c; overflow: hidden; }
  canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sr:focus { position: fixed; left: 8px; top: 8px; width: auto; height: auto; clip: auto; padding: 6px 10px;
    background: #1a1c2c; color: #ffcd75; outline: 3px solid #a7f070; z-index: 2; }
</style>
</head>
<body>
<canvas id="screen" aria-hidden="true"></canvas>
<a class="sr" href="/">Back to the swamp game</a>
<div class="sr" id="live" aria-live="polite"></div>

<script src="/static/pixel.js"></script>
<script>
(() => {
  "use strict";
  const { textWidth, text, wrap, sprite, PORTRAIT, rect, ellipse, ring, ditherPick, windowBox, get, fit } = Pixel;
  const screen = document.getElementById("screen");
  const ctx = screen.getContext("2d");
  let W = 320, H = 180, SCALE = 4;
  const resize = () => ({ W, H, SCALE } = fit(screen));
  addEventListener("resize", resize);
  resize();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // the gator, with a firefighter's helmet
  const FIRE_GATOR = [
    "....KKKKKKKKKK....",
    "..KKRRRRRRRRRRKK..",
    ".KRRRRRYYRRRRRRRK.",
    "KKKKKKKKKKKKKKKKKK",
    "..KgWWKK..KgWWKK..",
    "..KgWKKK..KgWKKK..",
    ...PORTRAIT.slice(4),
  ];
  const LANTERN = ["..KKK..", "..K.K..", ".KKKKK.", ".KYYYK.", ".KYWYK.", ".KYYYK.", ".KKKKK."];
  const FLAME_BODY = ["..YOORRY...", "..YORRROY..", ".YORRRROY..", ".YORRPRROY.", "YORRPPPRROY", "YORRPPPRROY",
    ".YORRRRROY.", "..YOOOOOY..", "...YYYYY..."];
  const FLAME = [                               // 11 x 14, three flickering tips over one body
    [".....Y.....", "....YY.....", "....YOY....", "...YOOY....", "...YOOOY..."],
    ["......Y....", ".....YY....", "....YOY....", "....YOOY...", "...YOOOY..."],
    ["....Y......", "....YY.....", "...YOY.....", "...YOOY....", "...YOOOY..."],
  ].map((tip) => tip.concat(FLAME_BODY));

  // ------------------------------------------------------------- what we know
  const S = { sense: null, rescue: null, online: false };
  async function pollSense() { S.sense = await get("/api/sense"); S.online = !!S.sense && S.sense.state !== "OFFLINE"; }
  async function pollRescue() { const r = await get("/api/ai/rescue?room=Room%201"); if (r) S.rescue = r; }

  // the breathing model's live answer (breathing_model.BreathingLive), as words for the notes
  function breathing() {
    const b = S.online && S.sense.breathing;
    if (!b) return { text: "?", col: "L", rate: null };
    if (b.status === "ok") return b.present
      ? { text: b.per_minute ? `YES ~${Math.round(b.per_minute)}/MIN` : "YES", col: "l", rate: b.per_minute }
      : { text: "NO", col: "W", rate: null };
    const words = { "moving": "WAIT", "needs scan": "NEEDS SCAN", "warming up": "WARMING UP",
                    "weak signal": "WEAK SIGNAL", "no model": "NO MODEL" };
    return { text: words[b.status] || "?", col: "L", rate: null };
  }

  // the room's status, in one place: what the sign, the echo and the notes show
  function status() {
    if (!S.online) return { key: "offline", sign: "NO SIGNAL", panel: "N", person: "?", moving: "?", priority: "-",
      say: "NO SIGNAL FROM THE BOOTH. WE CAN'T SEE INSIDE ROOM 1 RIGHT NOW." };
    const st = S.sense.state;
    if (st === "SCANNING" || st === "UNCALIBRATED") return { key: "scan", sign: "SCANNING ROOM", panel: "B",
      person: "?", moving: "?", priority: "-", say: "LEARNING WHAT THE EMPTY ROOM LOOKS LIKE. STAND CLEAR." };
    const line = S.rescue && S.rescue.line;
    if (st === "MOVING") return { key: "moving", sign: "PERSON, MOVING", panel: "O", person: "YES", moving: "YES",
      priority: "2", say: line || "ROOM 1: SOMEONE IS INSIDE AND MOVING. PRIORITY 2." };
    if (st === "STILL") {
      const br = breathing();
      const extra = br.rate ? ` BREATHING ABOUT ${Math.round(br.rate)} TIMES A MINUTE.` : "";
      return { key: "still", sign: "PERSON, NOT MOVING", panel: "R", person: "YES", moving: "NO",
        priority: "1", say: (line || "ROOM 1: SOMEONE IS INSIDE AND NOT MOVING. PRIORITY 1.") + extra };
    }
    return { key: "empty", sign: "NOBODY SEEN", panel: "G", person: "NOT SEEN", moving: "-", priority: "-",
      say: "ROOM 1: THE WI-FI DOESN'T SEE ANYONE. CHECK IT ANYWAY." };
  }

  // ------------------------------------------------------------- the night swamp + burning cabin
  function drawWorld(t, st) {
    const step = reduce ? 0 : Math.floor(t / 125);
    const groundY = H - 42;
    // sky: night, glowing orange near the fire (dithered, never a smooth gradient)
    for (let y = 0; y < groundY; y++) for (let x = 0; x < W; x++) {
      const tt = (y / groundY - 0.35) / 0.5;
      ctx.fillStyle = Pixel.P[tt <= 0 ? "K" : tt >= 1 ? "P" : (ditherPick(x, y, tt) ? "P" : "N")];
      ctx.fillRect(x, y, 1, 1);
    }
    for (let i = 0; i < W / 5; i++) rect(ctx, "W", (i * 97) % W, (i * 53) % Math.floor(groundY * 0.4), 1, 1); // stars
    ellipse(ctx, "W", W - 30, 22, 6, 6); rect(ctx, "L", W - 33, 20, 2, 2); // moon
    // far treeline
    for (let x = 0; x < W; x += 14) { ellipse(ctx, "D", x + 7, groundY - 18 - ((x * 7) % 9), 8, 8); rect(ctx, "D", x, groundY - 18, 16, 18); }
    // swamp water
    rect(ctx, "N", 0, groundY, W, H - groundY); rect(ctx, "T", 0, groundY, W, 1);
    for (let i = 0; i < W / 9; i++) rect(ctx, "G", ((i * 37) + Math.floor(step / 3)) % W, groundY + 3 + (i * 7) % 30, 3 + i % 4, 1);

    // the cabin on stilts, front wall cut away
    const cw = Math.min(210, W - 140), ch = Math.min(80, groundY - 76);
    const x0 = Math.max(6, Math.floor((W - 120 - cw) / 2)), x1 = x0 + cw;
    const floorY = groundY - 10, ceilY = floorY - ch;
    for (const sx of [x0 + 8, x0 + cw / 2, x1 - 10]) { rect(ctx, "K", sx - 1, floorY, 5, 14); rect(ctx, "d", sx, floorY, 3, 13); }
    // fire glow on the water under the cabin
    for (let x = x0; x < x1; x += 2) if ((x + step) % 6 < 3) rect(ctx, "O", x, groundY + 2 + (x % 5), 1, 1);
    rect(ctx, "K", x0 - 2, ceilY - 2, cw + 4, ch + 6);
    for (let y = ceilY; y < floorY; y++) rect(ctx, (y - ceilY) % 6 < 5 ? "w" : "d", x0, y, cw, 1); // back wall planks
    for (let y = ceilY + 2; y < floorY; y += 6) for (let x = x0 + ((y * 7) % 11); x < x1; x += 23) rect(ctx, "d", x, y, 6, 1);
    rect(ctx, "d", x0, floorY - 3, cw, 3); rect(ctx, "K", x0, floorY, cw, 2);   // floor
    // a back window showing flames outside
    const wx = x0 + Math.floor(cw * 0.45), wy = ceilY + 10;
    rect(ctx, "K", wx - 1, wy - 1, 18, 14); rect(ctx, (step % 2) ? "O" : "R", wx, wy, 16, 12);
    sprite(ctx, FLAME[step % 3], wx + 3, wy - 2);                   // fire seen through the back window
    rect(ctx, "K", wx + 7, wy, 1, 12); rect(ctx, "K", wx, wy + 6, 16, 1);
    // roof: a gable, sloping 1 pixel up for every 3 in
    const rl = x0 - 8, rr = x1 + 8, rows = Math.floor((rr - rl) / 6);
    for (let r = 0; r < rows; r++) {
      const y = ceilY - 3 - r;
      rect(ctx, "K", rl + r * 3 - 1, y, rr - rl - r * 6 + 2, 1);
      rect(ctx, (r >> 1) % 2 ? "d" : "w", rl + r * 3 + 1, y, rr - rl - r * 6 - 2, 1);
    }
    rect(ctx, "K", rl - 1, ceilY - 2, rr - rl + 2, 2);
    const roofY = (x) => ceilY - 3 - Math.floor(Math.min(x - rl, rr - x) / 3);
    // flames on the roof and out of the window, embers rising, smoke drifting
    for (const [fx, k] of [[x1 - 58, 0], [x1 - 40, 1], [x1 - 24, 2]]) sprite(ctx, FLAME[(step + k) % 3], fx, roofY(fx + 5) - 12);
    for (let i = 0; i < 18; i++) {
      const life = ((step * 2 + i * 17) % 60) / 60, ex = x1 - 56 + ((i * 13) % 44);
      rect(ctx, life < 0.5 ? "Y" : "O", ex + Math.round(Math.sin(life * 6 + i) * 3), roofY(ex) - 14 - Math.round(life * 50), 1, 1);
    }
    for (let i = 0; i < 7; i++) {
      const life = ((step + i * 9) % 64) / 64;
      const px = x1 - 34 - Math.round(life * 60) + i * 3, py = roofY(x1 - 34) - 18 - Math.round(life * 45);
      for (let y = -3; y <= 3; y++) for (let x = -6; x <= 6; x++) if (x * x / 36 + y * y / 9 <= 1 && ditherPick(px + x, py + y, 0.6 - life * 0.4))
        rect(ctx, life < 0.5 ? "G" : "D", px + x, py + y, 1, 1);
    }
    // smoke filling the top of the room (it's why a camera can't see)
    for (let y = ceilY; y < ceilY + Math.floor(ch * 0.45); y++) for (let x = x0; x < x1; x++) {
      const dens = 0.75 - (y - ceilY) / (ch * 0.6);
      if (ditherPick(x + Math.floor(step / 2), y, dens)) rect(ctx, (y + x) % 3 ? "G" : "L", x, y, 1, 1);
    }

    // inside: receivers on the left wall, curtain, hiding spot, lantern on the right wall
    const rxs = [0.3, 0.5, 0.7].map((f) => [x0 + 4, Math.round(ceilY + ch * f)]);
    const tx = [x1 - 14, Math.round(ceilY + ch * 0.45)];
    const curtainX = x0 + Math.floor(cw * 0.28);
    const hide = [x0 + Math.floor(cw * 0.62), floorY - 16];
    const lit = st.key === "still" || st.key === "moving";
    for (const [rx, ry] of rxs) {           // Wi-Fi lines: they cross the hiding spot
      const n = Math.max(Math.abs(tx[0] - rx), Math.abs(tx[1] - ry));
      for (let k = 0; k < n; k += 4) rect(ctx, lit ? "l" : "L", rx + 5 + Math.round((tx[0] - rx) * k / n), ry + 2 + Math.round((tx[1] + 3 - ry) * k / n), 2, 1);
    }
    for (const [rx, ry] of rxs) { rect(ctx, "K", rx - 1, ry - 1, 8, 7); rect(ctx, "S", rx, ry, 6, 5); rect(ctx, "C", rx + 1, ry + 1, 2, 1); }
    rect(ctx, "K", curtainX - 2, ceilY + 2, 18, 2);
    for (let y = ceilY + 4; y < floorY - 3; y++) for (let x = 0; x < 14; x++)
      rect(ctx, x % 4 === 0 ? "R" : "P", curtainX + x + ((y >> 3) % 2 && x % 4 === 0 ? 1 : 0), y, 1, 1);
    for (let k = 0; k < 9; k++) {                                  // tape X on the floor
      rect(ctx, "Y", hide[0] - 5 + k, floorY - 12 + k, 2, 1); rect(ctx, "Y", hide[0] + 3 - k, floorY - 12 + k, 2, 1);
    }
    sprite(ctx, LANTERN, tx[0], tx[1]);
    if (!reduce && (step % 8) < 4) ring(ctx, "Y", tx[0] + 3, tx[1] + 3, 6 + (step % 4) * 2, 2);

    // the Wi-Fi echo at the hiding spot: the only thing drawn about the person
    if (st.key === "still") {
      const rate = breathing().rate;                 // breaths per minute -> one ring cycle per breath
      const cycle = rate ? 60000 / rate : 1500;
      const r = 3 + (reduce ? 0 : Math.floor(((t % cycle) / cycle) * 12));
      ring(ctx, "C", hide[0], hide[1], r, r > 9 ? 3 : 1);
      ring(ctx, "C", hide[0], hide[1], Math.max(2, r - 6), 1);
      ellipse(ctx, "C", hide[0], hide[1], 1, 1);
    } else if (st.key === "moving") {
      for (let k = 0; k < 3; k++) {
        const r = 4 + ((step * 2 + k * 5) % 15);
        ring(ctx, k % 2 ? "Y" : "O", hide[0] + (reduce ? 0 : ((step + k) % 3) - 1), hide[1] + (reduce ? 0 : (step % 2)), r, r > 12 ? 3 : 1);
      }
      ellipse(ctx, "Y", hide[0], hide[1], 2, 2);
    }
    // labels under the cabin
    text(ctx, "RX", rxs[2][0] - 1, floorY + 4, "C");
    text(ctx, "TX", tx[0] + 1, floorY + 4, "Y");
    text(ctx, "HIDING SPOT", hide[0] - Math.floor(textWidth("HIDING SPOT") / 2), floorY + 4, "Y");
  }

  // ------------------------------------------------------------- UI: sign, notes, dialog, back button
  let since = 0, lastKey = "";
  let backBtn = null, hoverBack = false;
  const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  function drawUI(t, st) {
    if (st.key !== lastKey) { lastKey = st.key; since = t; }
    // hanging wooden sign with the room's status
    // centred in the free space between the back button (left) and the field notes (right)
    const freeL = 84, freeR = W - 124, sw = Math.max(100, Math.min(170, freeR - freeL - 8));
    const sx = Math.floor(freeL + (freeR - freeL - sw) / 2);
    const drop = [-8, -4, -1, 1, 0][Math.min(4, Math.floor((t - since) / 70))];
    const sy = 7 + drop;
    for (const rx of [sx + 9, sx + sw - 10]) for (let y = 0; y < sy; y++) rect(ctx, y % 2 ? "Y" : "d", rx, y, 1, 1);
    rect(ctx, "K", sx, sy, sw, 30); rect(ctx, "w", sx + 1, sy + 1, sw - 2, 28);
    for (let i = 4; i < sw - 8; i += 11) rect(ctx, "d", sx + i, sy + 2, 6, 1);
    text(ctx, "ROOM 1", sx + Math.floor((sw - textWidth("ROOM 1")) / 2), sy + 4, "Y");
    rect(ctx, "K", sx + 4, sy + 13, sw - 8, 13); rect(ctx, st.panel, sx + 5, sy + 14, sw - 10, 11);
    const bold = textWidth(st.sign, true) <= sw - 16;
    text(ctx, st.sign, sx + Math.floor((sw - textWidth(st.sign, bold)) / 2), sy + 16, "W", { bold, shadow: "K" });

    // field notes
    const nw = 116, nx = W - nw - 4, ny = 4, nh = 92;
    windowBox(ctx, nx, ny, nw, nh);
    text(ctx, "FIELD NOTES", nx + 6, ny + 6, "Y");
    const live = S.online && (reduce || Math.floor(t / 500) % 2);
    rect(ctx, live ? "l" : "G", nx + nw - 9, ny + 6, 3, 3);
    const stillFor = st.key === "still" && S.rescue ? clock(S.rescue.facts.seconds_in_state) : "-";
    const rows = [["PERSON", st.person, st.person === "YES" ? "l" : "W"], ["MOVING", st.moving, st.moving === "YES" ? "O" : "W"],
      ["STILL FOR", stillFor, "W"], ["BREATHING", breathing().text, breathing().col],
      ["PRIORITY", st.priority, st.priority === "1" ? "R" : st.priority === "2" ? "O" : "W"]];
    rows.forEach(([k, v, c], i) => {
      const y = ny + 17 + i * 11, room = nw - 16 - textWidth(k);
      if (textWidth(v) > room) v = v.replace(/^YES ~/, "~");          // "YES ~16/MIN" -> "~16/MIN"
      const bold = textWidth(v, true) <= room;                       // bold when it fits, else regular
      text(ctx, k, nx + 6, y, "L");
      text(ctx, v, nx + nw - 6 - textWidth(v, bold), y, c, { bold });
    });
    if (S.sense && S.sense.simulated) text(ctx, "DEMO DATA", nx + 6, ny + nh - 11, "Y");

    // the gator, in a fire helmet, says what it sees
    const dx = 4, dh = 35, dy = H - dh - 3, dw = W - 8;
    windowBox(ctx, dx, dy, dw, dh);
    rect(ctx, "K", dx + 5, dy + 5, 22, 22); rect(ctx, "R", dx + 6, dy + 6, 20, 20);
    sprite(ctx, FIRE_GATOR, dx + 7, dy + 7);
    text(ctx, "GATOR, RESCUE CREW", dx + 31, dy + 5, "Y");
    text(ctx, "PROTOTYPE", dx + dw - 7 - textWidth("PROTOTYPE"), dy + 5, "L");
    const lines = wrap(st.say, dw - 40).slice(0, 2);
    let shown = Math.floor((t - since) / (reduce ? 1 : 28));
    lines.forEach((ln, i) => { text(ctx, ln.slice(0, Math.max(0, shown)), dx + 31, dy + 14 + i * 9, "W"); shown -= ln.length; });

    // logo + back to the swamp game
    text(ctx, "WIFIND", 5, 5, "Y", { outline: "K", shadow: "R" });
    const label = "SWAMP GAME", bw = textWidth(label) + 18;
    windowBox(ctx, 4, 16, bw, 15, hoverBack ? "T" : "D");
    const k = Math.floor(t / 400) % 2;
    rect(ctx, "Y", 10 - k, 21, 1, 5); rect(ctx, "Y", 9 - k, 22, 1, 3); rect(ctx, "Y", 8 - k, 23, 1, 1);
    text(ctx, label, 14, 20, "Y");
    backBtn = { x: 4, y: 16, w: bw, h: 15 };
  }

  const toGame = (e) => { const r = screen.getBoundingClientRect(); return [(e.clientX - r.left) / SCALE, (e.clientY - r.top) / SCALE]; };
  const onBack = ([x, y]) => backBtn && x >= backBtn.x && x < backBtn.x + backBtn.w && y >= backBtn.y && y < backBtn.y + backBtn.h;
  screen.addEventListener("click", (e) => { if (onBack(toGame(e))) location.href = "/"; });
  screen.addEventListener("mousemove", (e) => { hoverBack = onBack(toGame(e)); screen.style.cursor = hoverBack ? "pointer" : ""; });

  let lastSpoken = "";
  function frame(t) {
    const st = status();
    drawWorld(t, st);
    drawUI(t, st);
    const spoken = `Room 1: ${st.sign}. ${st.say}`;   // the same news for screen readers
    if (spoken !== lastSpoken) { document.getElementById("live").textContent = spoken; lastSpoken = spoken; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  pollSense(); pollRescue();
  setInterval(pollSense, 500);
  setInterval(pollRescue, 2000);
})();
</script>
</body>
</html>
