<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatorwave · Swamp Watch</title>
<!--
  The judges' page, drawn as a 16-bit pixel-art scene (SNES style).

  Everything, text included, is drawn on ONE small canvas (~320x180 "game
  pixels") and scaled up by a whole number, so every pixel on screen is the
  same size. One 20-colour palette, hard edges; where colours meet, an ordered
  dither instead of a gradient. No images or web fonts: every sprite and the
  5x7 font are defined below as text grids.

  What the Wi-Fi knows is part of the scene:
    3 fishing bobbers = the 3 Wi-Fi receivers (they dip as each one feels movement)
    dock lantern      = the transmitter (it sends out rings)
    the gator         = the game: asleep on green, watching on red, CHOMP on a catch
  Data: /api/sense (4x/s), /api/phase (2x/s), /api/ai/last (every 2 s). Works on
  the laptop and through the Vultr hub. No data = night scene, "Gone fishin'".
-->
<style>
  html, body { margin: 0; height: 100%; background: #1a1c2c; overflow: hidden; }
  canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sr:focus { position: fixed; left: 8px; top: 8px; width: auto; height: auto; clip: auto; padding: 6px 10px;
    background: #1a1c2c; color: #ffcd75; outline: 3px solid #a7f070; z-index: 2; }
</style>
</head>
<body>
<canvas id="screen" aria-hidden="true"></canvas>
<a class="sr" href="/lab">Sensing Lab</a><!-- for keyboards and screen readers; the scene draws the button -->
<div class="sr" id="live" aria-live="polite"></div>

<script src="/static/pixel.js"></script>
<script>if (!window.Pixel) document.body.innerHTML = '<p style="color:#ffcd75;font:16px monospace;padding:24px">Can\'t load /static/pixel.js. The Gatorwave server running here is older than this page: restart it (Ctrl+C, then python app.py ...).</p>';</script>
<script>
(() => {
  "use strict";
  const { P, textWidth, text, wrap, sprite, PORTRAIT, rect, ellipse, ring, ditherPick, windowBox, get } = Pixel;

  // one look per moment: palette keys for each part of the scene
  const THEMES = {
    dusk:  { sky: ["O", "Y"], sun: "Y", far: "m", canopy: "f", canopyHi: "g", moss: "m", trunk: "d",
             water: "T", waterHi: "C", deep: "N", bank: "g", bankHi: "l", cloud: "W", cloudLo: "Y", stars: 0, flies: 4, glow: 0 },
    day:   { sky: ["S", "C"], sun: "Y", far: "m", canopy: "f", canopyHi: "g", moss: "m", trunk: "d",
             water: "T", waterHi: "C", deep: "N", bank: "g", bankHi: "l", cloud: "W", cloudLo: "L", stars: 0, flies: 0, glow: 0 },
    red:   { sky: ["R", "O"], sun: "Y", far: "P", canopy: "f", canopyHi: "m", moss: "m", trunk: "d",
             water: "D", waterHi: "O", deep: "K", bank: "f", bankHi: "m", cloud: "O", cloudLo: "P", stars: 0, flies: 0, glow: 1 },
    won:   { sky: ["P", "R"], sun: "Y", far: "D", canopy: "f", canopyHi: "m", moss: "m", trunk: "d",
             water: "N", waterHi: "Y", deep: "K", bank: "f", bankHi: "m", cloud: "O", cloudLo: "R", stars: 1, flies: 18, glow: 1 },
    night: { sky: ["K", "N"], sun: "W", far: "D", canopy: "D", canopyHi: "G", moss: "G", trunk: "d",
             water: "D", waterHi: "L", deep: "K", bank: "D", bankHi: "G", cloud: "G", cloudLo: "D", stars: 1, flies: 14, glow: 1 },
    mist:  { sky: ["L", "W"], sun: "W", far: "G", canopy: "f", canopyHi: "g", moss: "m", trunk: "d",
             water: "T", waterHi: "W", deep: "N", bank: "g", bankHi: "l", cloud: "W", cloudLo: "L", stars: 0, flies: 0, glow: 0, mist: 1 },
    grey:  { sky: ["G", "L"], sun: "W", far: "D", canopy: "D", canopyHi: "G", moss: "G", trunk: "d",
             water: "D", waterHi: "L", deep: "K", bank: "D", bankHi: "G", cloud: "L", cloudLo: "G", stars: 0, flies: 0, glow: 0 },
  };

  // what each game moment looks like and what the gator says
  const SCENES = {
    offline:   { theme: "night", title: "GONE FISHIN'", panel: "N", say: "THE BOOTH IS ASLEEP. COME BACK SOON AND TRY TO SNEAK PAST ME!" },
    lobby:     { theme: "dusk", title: "STEP OUT!", panel: "d", say: "ROUND OVER! HIDER, COME ON OUT OF THE BOOTH." },
    scanning:  { theme: "mist", title: "LISTENING...", panel: "B", say: "SHH... I'M LEARNING WHAT AN EMPTY SWAMP SOUNDS LIKE." },
    hide:      { theme: "dusk", title: "HIDE!", panel: "O", say: "NEXT HIDER, CLIMB IN BEHIND THE CURTAIN AND GET COMFY." },
    countdown: { theme: "dusk", title: "GET READY!", panel: "Y", ink: "K", say: "THE GATOR IS WAKING UP... 3... 2... 1..." },
    green:     { theme: "day", title: "GREEN LIGHT!", panel: "g", say: "GREEN LIGHT! PADDLE AWAY WHILE I NAP." },
    red:       { theme: "red", title: "RED LIGHT!", panel: "R", say: "RED LIGHT! FREEZE... I'M WATCHING THE WATER." },
    out:       { theme: "red", title: "CHOMP!", panel: "R", say: "CHOMP! THE WI-FI FELT THAT WIGGLE." },
    won:       { theme: "won", title: "YOU MADE IT!", panel: "Y", ink: "K", say: "YOU MADE IT! I NEVER EVEN SAW YOU." },
    paused:    { theme: "grey", title: "PAUSED", panel: "G", say: "PAUSED. EVERYBODY FREEZE... FOR REAL THIS TIME." },
  };
  const PHASE_SCENE = { LOBBY: "lobby", SCAN: "scanning", HIDE: "hide", COUNTDOWN: "countdown", GREEN: "green",
    RED: "red", OUT: "out", WON: "won", PAUSED: "paused" };
  const FEELS = { MOVING: ["A WIGGLE!", "O"], STILL: ["STILLNESS", "l"], EMPTY: ["NOBODY HOME", "L"],
    UNCALIBRATED: ["NEEDS A SCAN", "L"], SCANNING: ["LISTENING", "C"], OFFLINE: ["SNOOZING", "L"] };


  const BOBBER = ["....K....", "....K....", "...KKK...", "..KRRRK..", ".KRYRRRK.", "KRRRRRRRK", "KWWWWWWWK",
    "KWWWWWWWK", ".KWWWWWK.", "..KKKKK.."];
  const BOBBER_ICON = ["...K...", "..KKK..", ".KRRRK.", "KRRYRRK", "KWWWWWK", ".KWWWK.", "..KKK.."];
  const LANTERN = ["..KKK..", "..K.K..", ".KKKKK.", ".KYYYK.", ".KYWYK.", ".KYYYK.", ".KYYYK.", ".KKKKK."];
  const FLAMES = [
    ["...Y...", "..YOY..", "..YOY..", ".YOROY.", ".YOROY.", "..YOY.."],
    ["..Y....", "..YY...", ".YOOY..", ".YORY..", ".YOROY.", "..YOY.."],
    ["....Y..", "...YY..", "..YOOY.", "..YROY.", ".YOROY.", "..YOY.."],
  ];


  // seeded random: the swamp is laid out the same on every load
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  // ------------------------------------------------------------- the canvas
  const screen = document.getElementById("screen");
  const ctx = screen.getContext("2d");
  let W = 320, H = 180, SCALE = 4, waterY = 114, cx = 160;
  const bg = document.createElement("canvas");
  const bctx = bg.getContext("2d");
  let bgKey = "";

  function resize() {
    const vw = innerWidth, vh = innerHeight;
    SCALE = Math.max(2, Math.floor(Math.min(vw / 300, vh / 170)));
    W = Math.floor(vw / SCALE); H = Math.floor(vh / SCALE);
    screen.width = W; screen.height = H;
    screen.style.width = W * SCALE + "px"; screen.style.height = H * SCALE + "px";
    ctx.imageSmoothingEnabled = false;
    waterY = H - 66; cx = Math.floor(W / 2);
    bgKey = "";
  }
  addEventListener("resize", resize);
  resize();
  const X = (designX) => cx + designX - 160; // the stage is designed 320 wide, centred

  // ------------------------------------------------------------- static background (cached per look + size)
  function drawBackground(th) {
    bg.width = W; bg.height = H;
    const c = bctx;
    seed = 7;
    // sky: two colours, dithered where they meet
    for (let y = 0; y < waterY; y++) {
      const t = (y / waterY - 0.38) / 0.3;
      for (let x = 0; x < W; x++) {
        c.fillStyle = P[t <= 0 ? th.sky[0] : t >= 1 ? th.sky[1] : (ditherPick(x, y, t) ? th.sky[1] : th.sky[0])];
        c.fillRect(x, y, 1, 1);
      }
    }
    for (let i = 0; i < W / 4; i++) {
      const tw = rnd() < 0.2, sx = Math.floor(rnd() * W), sy = Math.floor(rnd() * waterY * 0.55);
      if (th.stars) rect(c, tw ? "Y" : "W", sx, sy, 1, 1);
    }
    // sun or moon, low behind the trees
    const sx = X(92), sy = waterY - 34;
    ellipse(c, th.sun, sx, sy, 9, 9);
    if (th.sun === "W") { rect(c, "L", sx - 3, sy - 2, 2, 2); rect(c, "L", sx + 2, sy + 3, 3, 2); rect(c, "L", sx + 4, sy - 4, 1, 1); }
    else { rect(c, "W", sx - 4, sy - 5, 3, 1); rect(c, "W", sx - 5, sy - 4, 1, 2); }
    // far treeline: rounded treetops, no outline (it's far away)
    let x = 0;
    while (x < W) {
      const r = 5 + Math.floor(rnd() * 6), h = 10 + Math.floor(rnd() * 12);
      ellipse(c, th.far, x + r, waterY - h, r, r);
      rect(c, th.far, x, waterY - h, r * 2 + 1, h);
      x += r * 2 - 2;
    }
    // cypress trees: flared trunks, flat layered canopies, hanging moss
    for (const [dx, h, w] of [[124, 58, 6], [152, 46, 5], [188, 66, 7], [222, 50, 5], [300, 70, 7], [24, 40, 4]]) {
      const tx = X(dx), base = waterY;
      for (let r = 0; r < h; r++) {           // trunk, widening toward the water
        const half = Math.round(w / 2 + Math.pow(Math.max(0, r - h * 0.6) / (h * 0.4), 2) * w);
        rect(c, "K", tx - half - 1, base - h + r, half * 2 + 3, 1);
        rect(c, th.trunk, tx - half, base - h + r, half * 2 + 1, 1);
        rect(c, "w", tx - half, base - h + r, 1, 1);
      }
      const ct = base - h - 6;
      for (let i = 0; i < 3; i++) {           // canopy layers: outline, fill, a lit top edge
        const ly = ct + i * 7, lx = tx + Math.round((rnd() - 0.5) * 6), rx = w * 2 + 4 + i * 4;
        ellipse(c, "K", lx, ly, rx + 1, 4);
        ellipse(c, th.canopy, lx, ly, rx, 3);
        rect(c, th.canopyHi, lx - rx + 3, ly - 3, rx * 2 - 5, 1);
        rect(c, th.canopyHi, lx - rx + 1, ly - 2, 3, 1);
      }
      for (let i = 0; i < 6; i++) {           // moss: dotted strands
        const mx = tx + Math.round((rnd() - 0.5) * w * 6), len = 4 + Math.floor(rnd() * 9);
        for (let k = 0; k < len; k += 2) rect(c, th.moss, mx + (k % 4 === 0 ? 0 : 1), ct + 18 + k, 1, 1);
      }
    }
    // water: a lit edge, then deeper water lower down (dithered)
    for (let y = waterY; y < H; y++) {
      const t = (y - waterY - 26) / 18;
      for (let x2 = 0; x2 < W; x2++) {
        c.fillStyle = P[t <= 0 ? th.water : t >= 1 ? th.deep : (ditherPick(x2, y, t) ? th.deep : th.water)];
        c.fillRect(x2, y, 1, 1);
      }
    }
    rect(c, th.waterHi, 0, waterY, W, 1);
    // left bank with grass
    const bankEnd = X(108);
    for (let x2 = 0; x2 <= bankEnd; x2++) {
      const t = Math.max(0, (x2 - (bankEnd - 30)) / 30);
      const topY = waterY - 8 + Math.round(t * t * 10);
      rect(c, "K", x2, topY - 1, 1, 1);
      rect(c, th.bank, x2, topY, 1, waterY + 4 - topY);
      rect(c, th.bankHi, x2, topY, 1, 1);
      if (x2 % 7 === 3) rect(c, th.bankHi, x2, topY - 2, 1, 2);
    }
    rect(c, "K", 0, waterY + 4, bankEnd + 1, 1);
    // tent
    const tx = X(30), ty = waterY - 26;
    for (let r = 0; r < 18; r++) {
      const half = Math.round(r * 0.75);
      rect(c, "K", tx - half - 1, ty + r, half * 2 + 3, 1);
      rect(c, "O", tx - half, ty + r, half * 2 + 1, 1);
      rect(c, "Y", tx - half, ty + r, Math.max(1, Math.round(half * 0.5)), 1);
      if (r > 6) { const dh = Math.round((r - 6) * 0.45); rect(c, "d", tx - dh, ty + r, dh * 2 + 1, 1); }
    }
    rect(c, "K", tx, ty - 6, 1, 6); rect(c, "R", tx + 1, ty - 6, 4, 2); rect(c, "K", tx - 14, ty + 18, 29, 1);
    // campfire logs (the flames move, so they're drawn every frame)
    const fx = X(60), fy = waterY - 6;
    rect(c, "K", fx - 5, fy, 11, 3); rect(c, "d", fx - 4, fy + 1, 9, 1); rect(c, "w", fx - 3, fy + 1, 2, 1);
    // dock + lantern post (the lantern glows, so it's drawn every frame)
    const dx = X(236);
    rect(c, "K", dx, waterY - 5, W - dx, 5);
    rect(c, "w", dx + 1, waterY - 4, W - dx - 1, 3);
    for (let p = dx + 6; p < W; p += 7) rect(c, "d", p, waterY - 4, 1, 3);
    for (const px of [dx + 4, dx + 30, dx + 58]) { rect(c, "K", px - 1, waterY, 5, 8); rect(c, "d", px, waterY, 3, 7); }
    const postX = X(244);
    rect(c, "K", postX - 1, waterY - 34, 5, 30); rect(c, "d", postX, waterY - 33, 3, 29); rect(c, "w", postX, waterY - 33, 1, 29);
    rect(c, "K", postX + 1, waterY - 34, 9, 1); rect(c, "K", postX + 9, waterY - 34, 1, 3);
    // lily pads + a flower
    for (const [lx, ly, r] of [[136, 26, 6], [200, 24, 7], [282, 16, 5], [72, 18, 5]]) {
      const px = X(lx), py = waterY + ly;
      ellipse(c, "K", px, py, r + 1, 2); ellipse(c, "g", px, py, r, 1); rect(c, "l", px - r + 2, py - 1, r, 1);
      rect(c, th.water, px + r - 3, py, 3, 1);
    }
    const fl = X(202), fly = waterY + 21;
    rect(c, "W", fl - 1, fly - 1, 3, 1); rect(c, "W", fl - 2, fly, 5, 1); rect(c, "Y", fl, fly, 1, 1);
  }

  // ------------------------------------------------------------- state from the server
  const S = { online: false, sense: null, phase: null, roundStart: null, scene: "", sceneAt: 0, ai: null, say: "", sayAt: 0 };

  async function pollSense() {
    const s = await get("/api/sense");
    S.online = !!s && s.state !== "OFFLINE";
    S.sense = s;
  }
  async function pollPhase() {
    const p = await get("/api/phase");
    if (!p) return;
    if (p.phase === "GREEN" && !["GREEN", "RED", "PAUSED"].includes(S.phase)) S.roundStart = Date.now();
    if (["LOBBY", "SCAN", "HIDE"].includes(p.phase)) S.roundStart = null;
    S.phase = p.phase;
  }
  async function pollAi() {
    const a = await get("/api/ai/last");
    if (a && a.line && a.line !== S.ai) {
      const first = S.ai === null;
      S.ai = a.line;
      if (!first) { S.say = a.line; S.sayAt = performance.now(); } // only lines that arrive while we watch
    }
  }
  function sceneName() {
    if (!S.online) return "offline";
    if (S.sense.state === "SCANNING") return "scanning";
    return PHASE_SCENE[S.phase] || "lobby";
  }

  // ------------------------------------------------------------- per-frame drawing
  const bobbers = [154, 186, 218].map((x) => ({ x, shown: 0, target: 0 }));
  seed = 3;
  const flies = Array.from({ length: 18 }, () => ({ x: rnd(), y: rnd() }));
  const clouds = [{ x: 0.12, y: 16, w: 22 }, { x: 0.58, y: 30, w: 16 }];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The gator, drawn from simple shapes so every edge is a hard pixel edge:
  // a long snout with scales, two eye bumps on top, nostrils and one tooth.
  function drawGator(c, t, scene, look) {
    const gx = X(94), gy = waterY + 6;           // top-left of the snout, out in open water
    const th = THEMES[SCENES[scene].theme];
    const chomp = scene === "out";
    const y = gy - (chomp ? 6 : 0);              // the head rises out of the water to chomp
    const EYES = [gx + 9, gx + 21];
    for (const bx of [-15, -10, -5]) {            // back ridges trailing behind
      rect(c, "K", gx + bx, gy + 4, 5, 1); rect(c, "K", gx + bx + 1, gy + 3, 3, 1); rect(c, "f", gx + bx + 2, gy + 3, 1, 1);
      rect(c, "K", gx + bx + 2, gy + 2, 1, 1);
    }
    if (chomp) {                                 // open mouth: top teeth, mouth, bottom teeth, lower jaw
      rect(c, "R", gx + 6, y + 8, 40, gy + 6 - (y + 8));
      for (let i = 8; i < 44; i += 3) { rect(c, "W", gx + i, y + 8, 2, 1); rect(c, "W", gx + i + 1, y + 9, 1, 1); }
      for (let i = 9; i < 44; i += 3) { rect(c, "W", gx + i, gy + 5, 2, 1); rect(c, "W", gx + i, gy + 4, 1, 1); }
      rect(c, "K", gx + 4, gy + 6, 42, 1); rect(c, "g", gx + 5, gy + 7, 40, 2); rect(c, "K", gx + 4, gy + 9, 42, 1);
    }
    // outlines first, then fills, so the eye bumps merge into the head
    rect(c, "K", gx, y + 1, 48, 7); rect(c, "K", gx + 1, y, 46, 9);
    for (const ex of EYES) ellipse(c, "K", ex, y, 6, 5);
    rect(c, "g", gx + 1, y + 1, 46, 7);
    for (const ex of EYES) ellipse(c, "g", ex, y, 5, 4);
    rect(c, "l", gx + 28, y + 1, 16, 1);         // light along the snout
    for (let i = 3; i < 44; i += 4) rect(c, "f", gx + i + (i % 8 ? 1 : 0), y + 3 + (i % 8 ? 1 : 0), 1, 1); // scales
    rect(c, "f", gx + 1, y + 7, 46, 1);          // shaded jaw line
    rect(c, "K", gx + 41, y + 2, 1, 1); rect(c, "K", gx + 44, y + 2, 1, 1); // nostrils
    if (!chomp) { rect(c, "W", gx + 38, y + 8, 1, 2); rect(c, "K", gx + 37, y + 9, 1, 1); } // one cheeky tooth
    // eyes: 4x3 whites; lids by scene; on red the pupils turn to the busiest bobber
    const lids = { green: 3, offline: 3, paused: 3, lobby: 1, hide: 1, countdown: 1, scanning: 1, won: 2 }[scene] ?? 0;
    for (const ex of EYES) {
      rect(c, "l", ex - 3, y - 3, 2, 1);
      rect(c, "W", ex - 2, y - 2, 4, 3);
      rect(c, "K", ex + look, y - 2, 1, 3);
      if (lids > 0) rect(c, "g", ex - 2, y - 2, 4, Math.min(lids, 3));
      if (lids >= 3) rect(c, "K", ex - 2, y, 4, 1);
    }
    // water over the belly, so the gator sits IN the swamp
    rect(c, th.water, gx - 18, gy + 10, 70, 4);
    for (let i = 0; i < 70; i += 4) rect(c, th.waterHi, gx - 18 + i + (Math.floor(t / 300) % 2), gy + 10, 2, 1);
    if (lids >= 3 && !reduce) {                  // zzz while asleep
      for (let i = 0; i < 3; i++) {
        const k = (t / 1800 + i / 3) % 1;
        text(c, "Z", gx + 24 + Math.round(k * 8), gy - 12 - Math.round(k * 16), "W", { outline: "K" });
      }
    }
    if (chomp && t - S.sceneAt < 1000) {         // splash for the first second of a catch
      const k = (t - S.sceneAt) / 1000;
      for (const dx of [-10, -4, 4, 10]) rect(c, "C", gx + 24 + Math.round(dx * k * 3), gy + 6 - Math.round(k * 16) + Math.round(k * k * 14), 1, 2);
    }
  }

  function drawScene(t) {
    const scene = S.scene, sc = SCENES[scene], th = THEMES[sc.theme];
    const key = sc.theme + W + "x" + H;
    if (key !== bgKey) { drawBackground(th); bgKey = key; }
    ctx.drawImage(bg, 0, 0);
    const step = reduce ? 0 : Math.floor(t / 125); // animations tick at 8 fps, like the old consoles

    for (const cl of clouds) {                     // clouds drift 1 pixel at a time
      const x = Math.floor(((cl.x * W + step / 6) % (W + 40)) - 20);
      ellipse(ctx, th.cloud, x, cl.y, cl.w / 2, 3);
      ellipse(ctx, th.cloud, x - Math.floor(cl.w / 4), cl.y + 1, Math.floor(cl.w / 3), 2);
      rect(ctx, th.cloudLo, x - cl.w / 2 + 2, cl.y + 3, cl.w - 3, 1);
    }
    seed = 99;                                     // water shimmer
    for (let i = 0; i < W / 10; i++) {
      const sx = Math.floor(rnd() * W), sy = waterY + 3 + Math.floor(rnd() * (H - waterY - 6)), len = 2 + Math.floor(rnd() * 5);
      rect(ctx, th.waterHi, (sx + (Math.floor(step / 4) % 3)) % W, sy, len, 1);
    }
    sprite(ctx, FLAMES[step % 3], X(60) - 3, waterY - 12); // campfire

    const lx = X(249), ly = waterY - 31;           // lantern = transmitter: glow, rings, reflection
    if (th.glow) for (let r = 6; r <= 10; r += 2) ring(ctx, "Y", lx + 3, ly + 4, r, 3);
    if (!reduce) for (let i = 0; i < 3; i++) {
      const r = 4 + ((step + i * 8) % 24);
      ring(ctx, r > 16 ? "L" : "Y", lx + 3, ly + 4, r, r > 12 ? 3 : 1);
    }
    sprite(ctx, LANTERN, lx, ly);
    for (let k = 0; k < 4; k++) if ((step + k) % 2) rect(ctx, "Y", lx + 3, waterY + 2 + k * 3, 1, 2);

    let loudest = 0, loudestX = 154;              // bobbers = receivers
    bobbers.forEach((b, i) => {
      b.shown += (b.target - b.shown) * 0.2;
      const v = Math.min(b.shown, 5);
      const bob = reduce ? 0 : Math.round(Math.sin(t / (380 - v * 40) + i * 2) * (0.6 + v * 0.7));
      const dip = Math.round(v * 0.8);
      const bx = X(b.x), by = waterY + 4;
      const rx = 5 + Math.round(v * 2);
      for (let k = -rx; k <= rx; k += v > 1 ? 1 : 2) rect(ctx, th.waterHi, bx + k, by + 6 + (Math.abs(k) > rx - 2 ? -1 : 0), 1, 1);
      sprite(ctx, BOBBER, bx - 4, by - 4 + bob + dip);
      if (b.shown > loudest) { loudest = b.shown; loudestX = b.x; }
    });

    const watching = scene === "red" || scene === "out";
    const look = watching && loudest > 0.8 && loudestX > 154 ? 1 : 0; // eyes slide toward the far bobbers
    drawGator(ctx, t, scene, look);

    for (const [dx, h] of [[4, 34], [10, 42], [16, 30], [306, 38], [313, 46], [118, 22]]) { // cattails
      const x = X(dx), base = H;
      const sway = reduce ? 0 : ((step + dx) % 16 < 8 ? 0 : 1);
      rect(ctx, "K", x - 1, base - h, 3, h); rect(ctx, "m", x, base - h + 1, 1, h - 1);
      rect(ctx, "K", x - 2 + sway, base - h - 7, 5, 9); rect(ctx, "d", x - 1 + sway, base - h - 6, 3, 7); rect(ctx, "w", x - 1 + sway, base - h - 6, 1, 6);
      rect(ctx, "m", x + sway, base - h - 9, 1, 2);
    }
    for (let i = 0; i < th.flies; i++) {           // fireflies
      const f = flies[i];
      if (reduce || ((step + i * 3) % 10) < 6) rect(ctx, "Y", f.x * W, waterY * 0.35 + f.y * waterY * 0.6, 1, 1);
    }
    if (th.mist) {                                 // morning mist while scanning: flat wisps drifting over the water
      seed = 42;
      for (let i = 0; i < W / 12; i++) {
        const wy = waterY - 14 + Math.floor(rnd() * 20), len = 10 + Math.floor(rnd() * 22);
        const wx = Math.floor(rnd() * (W + 40) + step / 3) % (W + 40) - 20;
        for (let k = 0; k < len; k++) if ((k + wy) % 2 === 0 || (k > 3 && k < len - 3)) rect(ctx, "W", wx + k, wy, 1, 1);
      }
    }
  }

  // ------------------------------------------------------------- the UI (same pixels as the scene)
  function drawSign(t) {
    const sc = SCENES[S.scene];
    const narrow = W < 260;
    const sw = narrow ? W - 20 : Math.max(96, Math.min(150, W - 2 * 98));
    const sh = 21;
    const sx = Math.floor((W - sw) / 2);
    const drop = [-8, -4, -1, 1, 0][Math.min(4, Math.floor((t - S.sceneAt) / 70))]; // drops in and bounces on a change
    const sy = (narrow ? 16 : 7) + drop;
    for (const rx of [sx + 9, sx + sw - 10]) for (let y = 0; y < sy; y++) rect(ctx, y % 2 ? "Y" : "d", rx, y, 1, 1); // twisted rope
    rect(ctx, "K", sx, sy, sw, sh);
    rect(ctx, "w", sx + 1, sy + 1, sw - 2, sh - 2);
    for (let i = 4; i < sw - 8; i += 9) rect(ctx, "d", sx + i, sy + 2 + (i % 3 === 0 ? 0 : 1), 5, 1);   // grain
    for (let i = 3; i < sw - 8; i += 13) rect(ctx, "d", sx + i, sy + sh - 3, 6, 1);
    for (const nx of [sx + 8, sx + sw - 11]) { rect(ctx, "K", nx, sy + 2, 3, 3); rect(ctx, "L", nx + 1, sy + 3, 1, 1); }
    const px = sx + 4, py = sy + 6, pw = sw - 8, ph = 12;   // painted panel with the title
    rect(ctx, "K", px, py, pw, ph); rect(ctx, sc.panel, px + 1, py + 1, pw - 2, ph - 2);
    const bold = textWidth(sc.title, true) <= pw - 6;
    const tw = textWidth(sc.title, bold);
    text(ctx, sc.title, px + Math.floor((pw - tw) / 2), py + 2, sc.ink || "W", { bold, shadow: sc.ink ? null : "K" });
  }

  function drawNotes(t) {
    const narrow = W < 260;
    const w = narrow ? W - 8 : 92, h = narrow ? 36 : 70;
    const x = narrow ? 4 : W - w - 4, y = narrow ? 42 : 4;
    windowBox(ctx, x, y, w, h);
    const state = S.online ? S.sense.state : "OFFLINE";
    const [word, col] = FEELS[state] || [state, "W"];
    const live = S.online && (reduce || Math.floor(t / 500) % 2);
    rect(ctx, live ? "l" : "G", x + w - 9, y + 6, 3, 3);
    text(ctx, "FIELD NOTES", x + 6, y + 6, "Y");
    if (narrow) {
      text(ctx, word, x + 6, y + 16, col, { bold: textWidth(word, true) < w / 2 - 6 });
      meter(x + Math.floor(w / 2) + 2, y + 16, Math.floor(w / 2) - 10);
      text(ctx, "ROUND " + clockText(), x + 6, y + 26, "L");
      return;
    }
    text(ctx, "WI-FI FEELS", x + 6, y + 17, "L");
    text(ctx, word, x + 6, y + 26, col, { bold: textWidth(word, true) <= w - 12 });
    text(ctx, "WIGGLES", x + 6, y + 37, "L");
    meter(x + 6, y + 46, w - 12);
    text(ctx, "ROUND", x + 6, y + 57, "L");
    const ct = clockText();
    text(ctx, ct, x + w - 6 - textWidth(ct, true), y + 57, "W", { bold: true });
  }
  // the wiggle meter: segments up to 4x the freeze line; the white tick IS the freeze line
  function meter(x, y, w) {
    const m = S.online ? (S.sense.motion || 0) : 0, MAX = 4;
    rect(ctx, "K", x, y, w, 7); rect(ctx, "D", x + 1, y + 1, w - 2, 5);
    const segs = Math.floor((w - 2) / 3), lit = Math.round(Math.min(m / MAX, 1) * segs), freeze = Math.round(segs / MAX);
    for (let i = 0; i < lit; i++) rect(ctx, i < freeze ? "l" : i < freeze * 2 ? "O" : "R", x + 2 + i * 3, y + 2, 2, 3);
    rect(ctx, "W", x + 1 + freeze * 3, y - 1, 1, 9);
  }
  function clockText() {
    if (!S.roundStart || !["green", "red", "out", "won", "paused"].includes(S.scene)) return "-:--";
    const s = Math.floor((Date.now() - S.roundStart) / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  // "SENSING LAB" button, drawn in the scene's own pixels (under the legend)
  let rescueBtn = null;
  function drawRescueButton(t) {
    const label = "SENSING LAB", w = textWidth(label) + 18, h = 15;
    const x = 4, y = W < 300 ? H - 55 : 56;
    windowBox(ctx, x, y, w, h, hoverRescue ? "T" : "D");
    text(ctx, label, x + 5, y + 4, "Y");
    const ax = x + w - 9, ay = y + 4, k = Math.floor(t / 400) % 2;   // a little blinking arrow
    rect(ctx, "Y", ax + k, ay + 1, 1, 5); rect(ctx, "Y", ax + 1 + k, ay + 2, 1, 3); rect(ctx, "Y", ax + 2 + k, ay + 3, 1, 1);
    rescueBtn = { x, y, w, h };
  }
  let hoverRescue = false;
  const toGame = (e) => { const r = screen.getBoundingClientRect(); return [(e.clientX - r.left) / SCALE, (e.clientY - r.top) / SCALE]; };
  const onRescue = ([gx, gy]) => rescueBtn && gx >= rescueBtn.x && gx < rescueBtn.x + rescueBtn.w && gy >= rescueBtn.y && gy < rescueBtn.y + rescueBtn.h;
  screen.addEventListener("click", (e) => { if (onRescue(toGame(e))) location.href = "/lab"; });
  screen.addEventListener("mousemove", (e) => { hoverRescue = onRescue(toGame(e)); screen.style.cursor = hoverRescue ? "pointer" : ""; });

  function drawLegend() {
    if (W < 300) return;
    const x = 4, y = 17, w = 84, h = 36;
    windowBox(ctx, x, y, w, h, "D");
    sprite(ctx, BOBBER_ICON, x + 5, y + 6);
    text(ctx, "RECEIVER", x + 15, y + 6, "W");
    sprite(ctx, LANTERN, x + 5, y + 15);
    text(ctx, "TRANSMITTER", x + 15, y + 16, "W");
    text(ctx, "NO CAMERAS!", x + 15, y + 26, "Y");
  }

  function drawDialog(t) {
    const x = 4, h = 35, y = H - h - 3, w = W - 8;
    windowBox(ctx, x, y, w, h);
    rect(ctx, "K", x + 5, y + 5, 22, 22); rect(ctx, "T", x + 6, y + 6, 20, 20);
    sprite(ctx, PORTRAIT, x + 7, y + 8);
    text(ctx, "GATOR", x + 31, y + 5, "Y");
    const lines = wrap(S.say, w - 40).slice(-2);
    let shown = Math.floor((t - S.sayAt) / (reduce ? 1 : 28)); // types out, ~35 letters a second
    lines.forEach((ln, i) => {
      text(ctx, ln.slice(0, Math.max(0, shown)), x + 31, y + 14 + i * 9, "W");
      shown -= ln.length;
    });
    if (shown > 0 && Math.floor(t / 400) % 2) { // finished: the little blinking arrow
      rect(ctx, "Y", x + w - 10, y + h - 9, 5, 1); rect(ctx, "Y", x + w - 9, y + h - 8, 3, 1); rect(ctx, "Y", x + w - 8, y + h - 7, 1, 1);
    }
  }

  // ------------------------------------------------------------- main loop
  let lastSpoken = "";
  function frame(now) {
    const scene = sceneName();
    if (scene !== S.scene) {
      S.scene = scene; S.sceneAt = now;
      // a fresh AI line beats the stock line on a catch or a win
      const freshAi = S.say && S.say === S.ai && now - S.sayAt < 8000;
      if (!((scene === "out" || scene === "won") && freshAi)) { S.say = SCENES[scene].say; S.sayAt = now; }
    }
    const ratios = S.online ? (S.sense.ratios || (S.sense.receivers || []).map((r) => (r === "MOVING" ? 3 : 0.4))) : [];
    bobbers.forEach((b, i) => { b.target = ratios[i] ?? 0; });

    drawScene(now);
    drawLegend();
    drawSign(now);
    drawNotes(now);
    drawDialog(now);
    drawRescueButton(now);
    text(ctx, "GATORWAVE", 5, 5, "Y", { outline: "K", shadow: "R" });

    const spoken = `${SCENES[scene].title}. ${S.say}`; // the same news for screen readers
    if (spoken !== lastSpoken) { document.getElementById("live").textContent = spoken; lastSpoken = spoken; }
    requestAnimationFrame(frame);
  }

  S.say = SCENES.offline.say;
  requestAnimationFrame(frame);
  pollSense(); pollPhase(); pollAi();
  setInterval(pollSense, 250);
  setInterval(pollPhase, 500);
  setInterval(pollAi, 2000);
})();
</script>
</body>
</html>
